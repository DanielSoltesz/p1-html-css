<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opdracht 3-2 </title>
</head>

<body>
    <form action="">
        <label for="name">Voornaam</label>
        <input type="text" placeholder="Uw voornaam" id="name" name="name"pattern="[A-Za-z]+" title="Vull uw voornaam in" required="input"><br><br>
        <p></p>
        <label for="name">Achternaam</label>
        <input type="text" placeholder="Uw achternaam" id="name" name="name"pattern="[A-Za-z]+" title="Vull uw Achternaam in" required="input"><br><br>
        <p></p>
        <p>Aanhef</p>
        <input type="radio" placeholder="Dhr." required="" name="aanhef"> <label>Dhr.</label>
        <input type="radio" placeholder="Mevr." required="" name="aanhef"> <label>Mevr.</label>
        <p></p>
        <label for="huisnummer">Straat met huisnummer</label>
        <input type="text" placeholder="Uw straat met huisnummer" id="straat en huisnummer" huisnummer="huisnummer"pattern="[A-Za-z-1-0]+" title="Vull uw straat en huisnummer in" required="input"><br><br>
        <p></p>
        <label for="postcode">Postcode</label>
        <input type="text" placeholder="Uw postcode" id="postcode" required="input" minlength="3" postcode="postcode"pattern="[A-Z-1-0]+" title="Vull uw postcode in" required="input"><br><br>
        <p></p>
        <label for="Woonplaats">Woonplaats</label>
        <input type="text" placeholder="Uw woonplaats" id="Woonplaats" required="input" minlength="3" maxlength="" required="input">
        <p></p>
        <label for="land">Land</label>
        <input type="text" placeholder="Uw land" id="land" required="input" minlength="3" land="land"pattern="[A-Za-z]+" title="Vull uw land in" required="input"><br><br>
        <p></p>
        <label for="IBAN-nummer">IBAN-nummer</label>
        <input type="text" placeholder="Uw IBAN-nummer" id="IBAN-nummer" IBAN-nummere="IBAN-nummer"pattern="[A-Z]{2}[0-9]{2}[A-Z]{4}[0-9]{10}" title="Vull uw straat en huisnummer in" required="input"><br><br>
        <p></p>
        <p>Type abonnement</p>
        <input type="radio" placeholder="" required="" name="Type abonnement"> <label>Mobiel</label>
        <input type="radio" placeholder="" required="" name="Type abonnement"> <label>Glasvezel</label>
        <input type="radio" placeholder="" required="" name="Type abonnement"> <label>TV</label>
        <p></p>
        <label for="">Datum van ingang abonnement</label>
        <input type="date" placeholder="" id="" required="input" minlength="3" maxlength="" required="">
        <p></p>
        <label for="quantity">Looptijd abonnement in maanden :</label>
        <input type="number" id="quantity" name="quantity" min="1" max="12" required="input">
        <p></p>
        <label for="quantity">Aantal gebruikers op het abonnement :</label>
        <input type="number" id="quantity" name="quantity" min="1" max="4" required="input">
        <p></p>
        <label for="email">E-mailadres</label>
        <input type="email" placeholder="Uw E-mail" id="email" required="input" minlength="3" maxlength="" required="">
        <p></p>
        <label for="">Wachtwoord aanmaken</label>
        <input type="password" placeholder="Uw wachtwoord" id="" required="input" minlength="3" maxlength="" required="">
        <p></p>
        <label for="">Verzendknop</label>
        <p></p>
        <input type="submit" value="Verstuur formulier" required=""
            style="border-radius: 10px; background-color: lightgreen;">
    </form>
</body>

</html>
